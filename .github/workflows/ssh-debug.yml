name: SSH Debug

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Dump known_hosts state
        run: |
          echo "--- ssh version ---"
          ssh -V
          echo "--- known_hosts BEFORE keyscan ---"
          wc -l ~/.ssh/known_hosts 2>/dev/null || echo "(no known_hosts)"
          cut -c1-60 ~/.ssh/known_hosts 2>/dev/null || true
          echo "--- running keyscan exactly as deploy.yml does ---"
          ssh-keyscan -H 52.197.251.31 >> ~/.ssh/known_hosts
          echo "keyscan exit: $?"
          echo "--- known_hosts AFTER keyscan (first 60 chars/line) ---"
          wc -l ~/.ssh/known_hosts
          cut -c1-60 ~/.ssh/known_hosts
          echo "--- fingerprints parsed from known_hosts ---"
          ssh-keygen -lf ~/.ssh/known_hosts || echo "ssh-keygen failed to parse"
          echo "--- live server fingerprints (plain scan) ---"
          ssh-keyscan 52.197.251.31 2>/dev/null | ssh-keygen -lf - || true

      - name: OpenSSH connection attempt
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 ubuntu@52.197.251.31 'echo OPENSSH_OK; hostname'

      - name: net-ssh connection attempt
        continue-on-error: true
        run: |
          bundle exec ruby -e '
            require "net/ssh"
            ["always", "accept_new_or_local_tunnel"].each do |v|
              begin
                Net::SSH.start("52.197.251.31", "ubuntu", verify_host_key: v.to_sym, timeout: 20) do |s|
                  puts "#{v}: OK -> #{s.exec!("echo NETSSH_OK").strip}"
                end
              rescue => e
                puts "#{v}: #{e.class}: #{e.message}"
              end
            end
            puts "--- what net-ssh reads from known_hosts ---"
            keys = Net::SSH::KnownHosts.search_for("52.197.251.31", {})
            puts "entries found: #{keys.size}"
            keys.each { |k| puts "  #{k.ssh_type} #{Net::SSH::Buffer.from(:key, k).to_s.bytesize} bytes" }
          '
